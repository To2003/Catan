# Fly.io. `fly launch --no-deploy` writes one of these too; this is the shape
# the server needs, with a volume so a restart does not lose the games.
app = "tierra-austral"
primary_region = "eze"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  DB_PATH = "/data/tierra-austral.db"
  # Set WEB_ORIGIN with `fly secrets set` — it names the deployed front end and
  # changes per environment.

[[mounts]]
  source = "tierra_austral_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # WebSockets need a machine that is actually up: no scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
